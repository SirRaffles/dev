[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_ENV = "production"
  REACT_APP_API_URL = ""

# Note: For full functionality, deploy the backend API separately
# and set REACT_APP_API_URL to your backend URL

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
