[loggers]
keys=root,events,metrics,performance

[handlers]
keys=consoleHandler,fileHandler,eventFileHandler

[formatters]
keys=structuredFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_events]
level=INFO
handlers=eventFileHandler
qualname=events
propagate=0

[logger_metrics]
level=INFO
handlers=fileHandler
qualname=metrics
propagate=0

[logger_performance]
level=INFO
handlers=fileHandler
qualname=performance
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=structuredFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=structuredFormatter
args=('/var/log/v42-api/app.log', 'a')

[handler_eventFileHandler]
class=FileHandler
level=INFO
formatter=structuredFormatter
args=('/var/log/v42-api/events.log', 'a')

[formatter_structuredFormatter]
format=%(message)s
class=app.utils.logging.StructuredFormatter
