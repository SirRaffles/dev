name: Backend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          # CPU-only torch (silero VAD import in tests/test_audio_vad.py) — keep it
          # off the default index so we don't pull the multi-GB CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Everything else is the versioned single source of truth — edit the file,
          # not this workflow, when a new test needs a package.
          pip install -r backend/requirements-test.txt

      - name: Run tests
        working-directory: backend
        env:
          TESTING: "1"
        run: python -m pytest tests/ -v --timeout=60
