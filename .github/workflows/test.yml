name: Backend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install fastapi uvicorn python-multipart pydantic httpx \
                    pytest pytest-asyncio pytest-timeout reportlab python-docx markdown \
                    Pillow imagehash

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --timeout=60
