[project]
name = "whisper-transcription-backend"
version = "2.0.0"
description = "FastAPI backend for Whisper transcription with speaker diarization and multi-modal processing"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "faster-whisper>=1.1.0",
    "mlx-whisper>=0.4.0",
    "parakeet-mlx>=0.4.0",  # 60x real-time English transcription
    "yt-dlp>=2024.12.6",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    # Speaker diarization
    "pyannote.audio>=3.1",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # Export formats
    "python-docx>=1.1.2",
    "reportlab==4.1.0",
    "markdown==3.5.2",
    # Audio restoration (use latest for Python 3.11 compatibility)
    "noisereduce>=3.0",
    "librosa>=0.10.0", # Force modern version compatible with Python 3.11
    "numba>=0.57.0", # Force modern version compatible with Python 3.11
    "scipy>=1.11",
    "numpy>=1.24",
    # Multi-modal document processing
    "markitdown[all]>=0.1.0",
    "python-pptx>=0.6.21",
    "PyMuPDF>=1.23.0",
    # Video/Image processing
    "opencv-python>=4.8.0",
    "scenedetect[opencv]>=0.6.0",
    "imagehash>=4.3.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "docling>=2.66.0",
    "pymupdf4llm>=0.2.8",
    # Vision model (MLX-VLM for Apple Silicon)
    "mlx-vlm>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
