# Whisper Transcription App - NAS Reverse Proxy Config
# Add this to your nginx-proxy on NAS (192.168.50.171)
# Proxies whisper.v4value.ai to MacBook (192.168.50.155)

# Rate limiting zones (must be in http block or included from it)
# Upload/transcription endpoints: 5 requests/minute per IP (burst 3)
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
# Polling/status endpoints: 30 requests/minute per IP (burst 10)
limit_req_zone $binary_remote_addr zone=poll_limit:10m rate=30r/m;
# General API: 60 requests/minute per IP (burst 20)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Upstream definitions for MacBook services
upstream whisper_frontend {
    server 192.168.50.155:3000;
    keepalive 32;
}

upstream whisper_backend {
    server 192.168.50.155:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name whisper.v4value.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name whisper.v4value.ai;

    # SSL certificates (adjust path based on your NAS setup)
    ssl_certificate /etc/letsencrypt/live/whisper.v4value.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.v4value.ai/privkey.pem;

    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase max body size for audio/video uploads
    client_max_body_size 500M;

    # Frontend (React app on port 3000)
    location / {
        proxy_pass http://whisper_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Backend API (FastAPI on port 8000)
    # All API calls go through /api/ prefix
    location /transcribe {
        limit_req zone=upload_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for transcription (can take several minutes)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /job {
        limit_req zone=poll_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /batch {
        limit_req zone=upload_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Multi-modal processing (PDF, PPTX, video with visuals)
    location /process {
        limit_req zone=upload_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for document processing
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Model status endpoint
    location /models {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remaining backend routers (JPR file watcher, speakers, calls,
    # contexts, refinement). Keep generous timeouts for listing large
    # iCloud trees.
    location ~ ^/(jpr|speakers|calls|contexts|refine) {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Wake-on-LAN API status endpoint used by the frontend wake-proxy UI.
    location /api/wake-status {
        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Block FastAPI docs in production
    location /docs {
        return 404;
    }

    location /openapi.json {
        return 404;
    }
}
