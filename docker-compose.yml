version: '3.8'

services:
  ifs-sec-planning:
    image: nginx:alpine
    container_name: ifs-sec-planning
    ports:
      - "8093:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
