services:
  transcription-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: protect all API endpoints with a shared secret
      - API_KEY=${API_KEY:-}
      # HuggingFace token — required for speaker diarization (pyannote)
      # Get yours at https://huggingface.co/settings/tokens
      - HF_TOKEN=${HF_TOKEN:-}
      # Comma-separated allowed CORS origins (default: localhost dev ports)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      # Set to "true" to add HSTS header (use behind a TLS-terminating proxy)
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-false}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-large-v3}
    volumes:
      # Persist downloaded models across container restarts
      - model-cache:/app/.cache/huggingface
      - torch-cache:/app/.cache/torch
    restart: unless-stopped

volumes:
  model-cache:
  torch-cache:
