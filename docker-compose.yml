services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL_SIZE=large-v3
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - whisper-cache:/app/.cache/huggingface
      - torch-cache:/app/.cache/torch
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  whisper-cache:
  torch-cache:
